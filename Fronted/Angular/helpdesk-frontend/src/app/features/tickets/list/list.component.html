<div class="ticket-container">

  <div class="ticket-header">

    <h2>Listado de Tickets</h2>

  </div>

  <div class="search-box">

    <input
      type="text"
      placeholder="Buscar por título..."
      [(ngModel)]="searchText"
    >

  </div>
  <div class="filters">

  <select [(ngModel)]="selectedStatus">

    <option value="">Todos los estados</option>
    <option value="open">Abierto</option>
    <option value="in_progress">En progreso</option>
    <option value="resolved">Resuelto</option>
    <option value="closed">Cerrado</option>

  </select>

  <select [(ngModel)]="selectedPriority">

    <option value="">Todas las prioridades</option>
    <option value="low">Baja</option>
    <option value="medium">Media</option>
    <option value="high">Alta</option>
    <option value="urgent">Urgente</option>

  </select>

</div>

  <p class="loading" *ngIf="loading">
    Cargando tickets...
  </p>

  <p class="error" *ngIf="error">
    {{ error }}
  </p>

  <div class="table-container" *ngIf="filteredTickets().length > 0">

    <table>

      <thead>

        <tr>

          <th>Título</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th>Asignado</th>
          <th>Acción</th>

        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let ticket of filteredTickets()"
          class="ticket-row"
          (click)="viewTicket(ticket.id)"
        >

          <td>{{ ticket.title }}</td>

          <td>

            <span
              class="badge"
              [ngClass]="ticket.status"
            >
              {{ getStatusLabel(ticket.status) }}
            </span>

          </td>

          <td>

            <span
              class="badge"
              [ngClass]="ticket.priority"
            >
              {{ getPriorityLabel(ticket.priority) }}
            </span>

          </td>

          <td>

            {{ ticket.assignedTo || 'Sin asignar' }}

          </td>

          <td>

            <button
              class="btn-view"
              (click)="viewTicket(ticket.id); $event.stopPropagation()"
            >
              Ver
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <p *ngIf="!loading && filteredTickets().length === 0">

    No existen tickets.

  </p>

</div>
